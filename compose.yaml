services:
  calendar:
    build: .
    init: true
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      COLLECTION_ENABLED: "${COLLECTION_ENABLED:-false}"
      REFRESH_SECONDS: "${REFRESH_SECONDS:-900}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./.local:/app/.local
    shm_size: "1gb"
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4317/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
